ext {
    // minSdk 26 (Android 8.0): required by Health Connect and by @capgo/capacitor-health.
    // Capacitor's own default is 24. Dropping to 24 would exclude Health Connect entirely.
    minSdkVersion = 26
    // Google Play: new apps and updates must target API 36 (Android 16) or higher.
    // https://support.google.com/googleplay/android-developer/answer/11926878 (read 2026-10-12)
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}